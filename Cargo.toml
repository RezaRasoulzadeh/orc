[package]
name = "orc"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.29", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "local-offset"] }

[dev-dependencies]
tempfile = "3"
