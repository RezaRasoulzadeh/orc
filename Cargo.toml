[package]
name = "orc"
version = "0.3.0-beta.1"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.29", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "local-offset"] }
# The interactive command session is intentionally based on mature terminal
# primitives rather than owning terminal modes and key decoding in Orc.
rustyline = "17"
dialoguer = "0.11"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
